name: Release

on:
  push:
    branches:
      - master
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release needs full history + all tags to determine the version
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: |
          pnpm install

      # Security gate: fail the release on HIGH/CRITICAL findings.
      # Scans dependencies (vuln), committed secrets, and CI/IaC misconfig.
      # Note: Trivy suppresses dev-only deps by default; this extension ships no
      # runtime deps (everything is webpack-bundled), so secret/misconfig scanning
      # is the gate's main active value here.
      - name: Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'
          # Keep the ~1GB Trivy DB OUT of the workspace. Its default
          # (${{ github.workspace }}/.cache/trivy) gets picked up by vsce, whose
          # secret scanner then fails trying to scan the 1GB DB at publish time.
          cache-dir: ${{ runner.temp }}/.trivy-cache

      - name: Create new version & CHANGELOG.md
        id: chkVersion
        run: pnpm run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Print next version
        run: |
          echo ${{ steps.chkVersion.outputs.NEXT_RELEASE_VERSION }}
          echo ${{ steps.chkVersion.outputs.NEXT_RELEASE_NOTES }}
          echo "The next version is ${{ steps.chkVersion.outputs.NEXT_RELEASE_VERSION && steps.chkVersion.outputs.NEXT_RELEASE_VERSION || 'N/A' }}" >> $GITHUB_STEP_SUMMARY


      # - name: Update version files and create tag
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
        
      #     pnpm run version
      #     git add .

      
      # - name: Build plugin
      #   run: |
      #     pnpm run build

      # Only publish when semantic-release actually cut a new version.
      # Otherwise this step would re-publish the stale package.json version.
      - name: Publish
        if: steps.chkVersion.outputs.NEXT_RELEASE_VERSION != ''
        run: pnpm run deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # - name: Create release
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     VERSION=$(node -p "require('./package.json').version")

      #     gh release create "$VERSION" \
      #       --title="Release v$VERSION" \
      #       main.js manifest.json styles.css
      
      - name: Push Tag and staged Files
        if: steps.chkVersion.outputs.NEXT_RELEASE_VERSION != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Updating version files to $VERSION"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "chore(release): v${{ steps.chkVersion.outputs.NEXT_RELEASE_VERSION }} [skip ci] ${{ steps.chkVersion.outputs.NEXT_RELEASE_NOTES }}"
          git tag -a $VERSION -m "$VERSION"
          git push --follow-tags